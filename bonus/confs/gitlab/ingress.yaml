# Host rule: http://gitlab.local/ on the host (port 80 -> k3d loadbalancer ->
# Traefik). It is more specific than the catch-all Ingress of the application,
# so Traefik routes gitlab.local here and everything else to wil-playground.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitlab
  namespace: gitlab
spec:
  rules:
    - host: gitlab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitlab
                port:
                  number: 80
