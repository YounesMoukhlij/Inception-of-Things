# No host rule: this is the catch-all backend of the cluster,
# so http://localhost:8888/ reaches the application.
# (GitLab has its own Ingress with a Host rule, which wins over this one.)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wil-playground
  namespace: dev
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wil-playground
                port:
                  number: 8888
