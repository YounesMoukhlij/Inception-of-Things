# K3s server (control-plane) configuration.
# Read automatically from /etc/rancher/k3s/config.yaml by the k3s install
# script, so we don't have to pass a long list of CLI flags.
#
# __IFACE__ is replaced at provisioning time by scripts/server.sh with the
# name of the interface actually carrying 192.168.56.110 (predictable
# network interface names such as enp0s8 vary across systems).

write-kubeconfig-mode: "0644"
node-ip: "192.168.56.110"
bind-address: "192.168.56.110"
advertise-address: "192.168.56.110"
tls-san:
  - "192.168.56.110"
flannel-iface: "__IFACE__"
