# K3s agent (worker) configuration.
# Read automatically from /etc/rancher/k3s/config.yaml by the k3s install
# script.
#
# __IFACE__ and __TOKEN__ are replaced at provisioning time by
# scripts/worker.sh: __IFACE__ with the interface carrying 192.168.56.111,
# __TOKEN__ with the join token generated by the server node and shared
# through the /vagrant synced folder.

node-ip: "192.168.56.111"
flannel-iface: "__IFACE__"
server: "https://192.168.56.110:6443"
token: "__TOKEN__"
